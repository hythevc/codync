# Overrides applied by tools/dev-builder.cjs (arrays replace, never merge).
appId: ai.squadbots.Squadbots.dev
productName: Squadbots Dev
# Linux package managers and Windows installer caches also key on package.json's name.
extraMetadata:
  name: squadbots-desktop-dev
  productName: Squadbots Dev
  desktopName: squadbots-dev.desktop
protocols:
  - name: Squadbots Dev
    schemes: [squadbots-dev, ai.squadbots.Squadbots.dev]
publish: null
mac:
  signIgnore:
    - SquadbotsDevScreen\.app/Contents/Helpers/cua-driver$
  artifactName: squadbots-dev-macos.${ext}
  notarize: false
  extraFiles:
    - from: build/native/SquadbotsDevScreen.app
      to: Library/LoginItems/SquadbotsDevScreen.app
    - from: resources/mac/ai.squadbots.Squadbots.dev.screen.plist
      to: Library/LaunchAgents/ai.squadbots.Squadbots.dev.screen.plist
dmg:
  artifactName: squadbots-dev-macos.dmg
linux:
  executableName: squadbots-dev
  artifactName: squadbots-dev-linux-${arch}.${ext}
  desktop:
    entry:
      StartupWMClass: Squadbots Dev
win:
  artifactName: squadbots-dev-windows-x64.${ext}
  extraResources:
    - from: build/native/squadbots-host.exe
      to: squadbots-host.exe
    - from: build/native/squadbots-dev-hostw.exe
      to: squadbots-dev-hostw.exe
    - from: build/native/cua-driver.exe
      to: cua-driver.exe
    - from: build/native/cua-driver-uia.exe
      to: cua-driver-uia.exe
    - from: build/native/cua-driver.LICENSE
      to: cua-driver.LICENSE
    - from: resources/icon.png
      to: icon.png
